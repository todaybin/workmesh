name: Publish workmesh (npm)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      publish:
        description: "Publish to npm and create GitHub release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  OPENCODE_CHANNEL: latest
  OPENCODE_RELEASE: "true"
  GH_REPO: todaybin/workmesh

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install C++ build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "OPENCODE_VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "OPENCODE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Setup npm auth
        if: ${{ inputs.publish }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: ${{ inputs.publish }}
        run: gh release create v${OPENCODE_VERSION} -d --target ${GITHUB_SHA} --title "v${OPENCODE_VERSION}" --notes "Workmesh 公开发布 v0.1.0"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build standalone binaries (workmesh)
        run: bun run --cwd packages/opencode script/build.ts --workmesh --release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS_DEV_API_JSON: ${{ secrets.MODELS_DEV_API_JSON }}

      - name: Upload baseline binary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workmesh-windows-x64-baseline
          path: packages/opencode/dist/workmesh-windows-x64-baseline
          if-no-files-found: warn

      - name: Publish to npm
        if: ${{ inputs.publish }}
        continue-on-error: true
        run: bun run --cwd packages/opencode script/publish.ts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published
        if: ${{ inputs.publish }}
        continue-on-error: true
        run: npm view workmesh@latest version
